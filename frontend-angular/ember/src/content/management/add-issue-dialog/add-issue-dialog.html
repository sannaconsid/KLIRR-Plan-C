<h2 mat-dialog-title i18n>Add New Issue</h2>
<mat-dialog-content>
  <mat-form-field>
    <mat-label i18n>Name</mat-label>
    <input matInput [(ngModel)]="name" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onCancelClick()" i18n>Cancel</button>
  <button matButton [mat-dialog-close]="name()" cdkFocusInitial i18n>Ok</button>
</mat-dialog-actions>
